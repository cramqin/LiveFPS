name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'hyperfps123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'hyperfps' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'hyperfps123' }}

      - name: Prepare Release Artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/HyperFPS-${TAG_NAME}.apk"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperFPS-release-apk
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
